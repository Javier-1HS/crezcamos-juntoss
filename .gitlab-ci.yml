# GitLab CI/CD Pipeline - Despliegue en GCP
# Proyecto: Maven Users API
# Arquitectura: GitLab Runner (VM1) -> GitLab Registry (VM1) -> GKE (VM2)

variables:
  # Configuración de la aplicación
  APP_NAME: "maven-users-api"
  JAVA_VERSION: "17"
  MAVEN_VERSION: "3.9.6"
  
  # Configuración de GCP
  GCP_PROJECT_ID: "tu-proyecto-gcp"
  GCP_REGION: "us-central1"
  GKE_CLUSTER_NAME: "production-cluster"
  GKE_ZONE: "us-central1-a"
  K8S_NAMESPACE: "production"
  
  # Configuración de GitLab Registry
  REGISTRY_URL: "$CI_REGISTRY"
  IMAGE_NAME: "$CI_REGISTRY_IMAGE"
  IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"
  
  # Maven configuración
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  MAVEN_CLI_OPTS: "--batch-mode --errors --fail-at-end --show-version"
  
  # SonarQube
  SONAR_HOST_URL: "${SONAR_HOST_URL}"
  SONAR_TOKEN: "${SONAR_TOKEN}"

# Cache para optimizar builds
cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .m2/repository/
    - target/

# Stages del pipeline
stages:
  - validate
  - security-scan
  - build
  - test
  - quality
  - docker
  - security-docker
  - deploy
  - cleanup

# ==========================================
# STAGE 1: VALIDATE
# ==========================================

validate:code:
  stage: validate
  image: maven:${MAVEN_VERSION}-eclipse-temurin-${JAVA_VERSION}
  script:
    - echo "🔍 Validando estructura del proyecto..."
    - mvn validate
    - mvn dependency:tree
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
  tags:
    - gitlab-runner-vm1

# ==========================================
# STAGE 2: SECURITY SCAN (PRE-BUILD)
# ==========================================

secrets:detection:
  stage: security-scan
  image: python:3.11-slim
  before_script:
    - pip install --no-cache-dir detect-secrets==1.5.0
  script:
    - echo "🔐 Escaneando secretos en el código..."
    - |
      if [ -f ".secrets.baseline" ]; then
        echo "✓ Usando baseline existente"
        detect-secrets scan --baseline .secrets.baseline > .secrets.new
      else
        echo "⚠ Creando nuevo baseline"
        detect-secrets scan --all-files \
          --exclude-files '(\.git/|\.m2/|target/|\.secrets\.)' \
          > .secrets.baseline
      fi
    - |
      python3 << 'EOF'
      import json, sys
      try:
          with open('.secrets.baseline') as f:
              data = json.load(f)
          results = data.get('results', {})
          count = sum(len(v) for v in results.values())
          print(f"📊 Secretos encontrados: {count}")
          if count > 0:
              print("❌ FALLO: Se detectaron secretos en el código")
              sys.exit(1)
          print("✓ No se encontraron secretos")
      except Exception as e:
          print(f"Error: {e}")
          sys.exit(1)
      EOF
  artifacts:
    paths:
      - .secrets.baseline
      - .secrets.new
    expire_in: 1 week
    when: always
  allow_failure: false
  tags:
    - gitlab-runner-vm1

dependency:check:
  stage: security-scan
  image: maven:${MAVEN_VERSION}-eclipse-temurin-${JAVA_VERSION}
  script:
    - echo "📦 Analizando dependencias vulnerables..."
    - mvn dependency:check -DskipTests
  artifacts:
    reports:
      dependency_scanning: target/dependency-check-report.xml
    when: always
  allow_failure: true
  tags:
    - gitlab-runner-vm1

# ==========================================
# STAGE 3: BUILD
# ==========================================

build:maven:
  stage: build
  image: maven:${MAVEN_VERSION}-eclipse-temurin-${JAVA_VERSION}
  script:
    - echo "🏗️  Compilando aplicación con Maven..."
    - mvn $MAVEN_CLI_OPTS clean compile
    - mvn $MAVEN_CLI_OPTS package -DskipTests
    - echo "✓ Compilación exitosa"
    - ls -lh target/*.jar
  artifacts:
    paths:
      - target/*.jar
    expire_in: 1 day
  tags:
    - gitlab-runner-vm1

# ==========================================
# STAGE 4: TEST
# ==========================================

test:unit:
  stage: test
  image: maven:${MAVEN_VERSION}-eclipse-temurin-${JAVA_VERSION}
  script:
    - echo "🧪 Ejecutando pruebas unitarias..."
    - mvn $MAVEN_CLI_OPTS test
  coverage: '/Total.*?([0-9]{1,3})%/'
  artifacts:
    when: always
    reports:
      junit:
        - target/surefire-reports/TEST-*.xml
      coverage_report:
        coverage_format: cobertura
        path: target/site/cobertura/coverage.xml
    paths:
      - target/surefire-reports/
      - target/site/jacoco/
  tags:
    - gitlab-runner-vm1

test:integration:
  stage: test
  image: maven:${MAVEN_VERSION}-eclipse-temurin-${JAVA_VERSION}
  script:
    - echo "🔗 Ejecutando pruebas de integración..."
    - mvn $MAVEN_CLI_OPTS verify -DskipUnitTests
  artifacts:
    when: always
    reports:
      junit:
        - target/failsafe-reports/TEST-*.xml
  allow_failure: true
  tags:
    - gitlab-runner-vm1

# ==========================================
# STAGE 5: QUALITY
# ==========================================

sonarqube:analysis:
  stage: quality
  image: maven:${MAVEN_VERSION}-eclipse-temurin-${JAVA_VERSION}
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  script:
    - echo "📊 Analizando calidad de código con SonarQube..."
    - |
      mvn sonar:sonar \
        -Dsonar.projectKey=${CI_PROJECT_NAME} \
        -Dsonar.projectName=${CI_PROJECT_NAME} \
        -Dsonar.host.url=${SONAR_HOST_URL} \
        -Dsonar.token=${SONAR_TOKEN} \
        -Dsonar.qualitygate.wait=true \
        -Dsonar.sources=src/main \
        -Dsonar.tests=src/test \
        -Dsonar.java.binaries=target/classes \
        -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
  allow_failure: true
  only:
    - main
    - develop
    - merge_requests
  tags:
    - gitlab-runner-vm1

# ==========================================
# STAGE 6: DOCKER BUILD
# ==========================================

docker:build:
  stage: docker
  image: docker:24-cli
  services:
    - docker:24-dind
  before_script:
    - echo "🐳 Autenticando en GitLab Container Registry..."
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - echo "🏗️  Construyendo imagen Docker..."
    - |
      docker build \
        --build-arg BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ') \
        --build-arg VCS_REF=$CI_COMMIT_SHORT_SHA \
        --build-arg VERSION=$CI_COMMIT_TAG \
        -t $IMAGE_NAME:$IMAGE_TAG \
        -t $IMAGE_NAME:latest \
        -f Dockerfile .
    
    - echo "📤 Subiendo imagen a GitLab Registry..."
    - docker push $IMAGE_NAME:$IMAGE_TAG
    - docker push $IMAGE_NAME:latest
    
    - echo "✓ Imagen publicada:"
    - echo "  - $IMAGE_NAME:$IMAGE_TAG"
    - echo "  - $IMAGE_NAME:latest"
  dependencies:
    - build:maven
  only:
    - main
    - develop
    - tags
  tags:
    - gitlab-runner-vm1

# ==========================================
# STAGE 7: SECURITY DOCKER SCAN
# ==========================================

trivy:scan:
  stage: security-docker
  image: docker:24-cli
  services:
    - docker:24-dind
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - echo "🔍 Instalando Trivy..."
    - |
      apk add --no-cache curl
      curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
    
    - echo "🛡️  Escaneando vulnerabilidades en imagen Docker..."
    - |
      trivy image \
        --severity HIGH,CRITICAL \
        --format table \
        --no-progress \
        $IMAGE_NAME:$IMAGE_TAG
    
    - echo "📄 Generando reporte SARIF..."
    - |
      trivy image \
        --severity HIGH,CRITICAL \
        --format sarif \
        --output trivy-report.sarif \
        $IMAGE_NAME:$IMAGE_TAG
  artifacts:
    reports:
      container_scanning: trivy-report.sarif
    paths:
      - trivy-report.sarif
    expire_in: 1 week
    when: always
  allow_failure: false
  only:
    - main
    - develop
    - tags
  tags:
    - gitlab-runner-vm1

grype:scan:
  stage: security-docker
  image: docker:24-cli
  services:
    - docker:24-dind
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - echo "🔍 Instalando Grype..."
    - |
      apk add --no-cache curl
      curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
    
    - echo "🛡️  Escaneando con Grype..."
    - grype $IMAGE_NAME:$IMAGE_TAG --fail-on critical
  allow_failure: true
  only:
    - main
    - develop
  tags:
    - gitlab-runner-vm1

# ==========================================
# STAGE 8: DEPLOY TO GKE
# ==========================================

.deploy_template: &deploy_template
  image: google/cloud-sdk:alpine
  before_script:
    - echo "☁️  Configurando acceso a GCP..."
    - echo "$GCP_SERVICE_ACCOUNT_KEY" | base64 -d > ${HOME}/gcp-key.json
    - gcloud auth activate-service-account --key-file ${HOME}/gcp-key.json
    - gcloud config set project $GCP_PROJECT_ID
    - gcloud container clusters get-credentials $GKE_CLUSTER_NAME --zone=$GKE_ZONE
    
    - echo "📦 Instalando kubectl..."
    - gcloud components install kubectl --quiet
    - kubectl version --client
    
    - echo "🔐 Configurando acceso a GitLab Registry en K8s..."
    - |
      kubectl create secret docker-registry gitlab-registry \
        --docker-server=$CI_REGISTRY \
        --docker-username=$CI_DEPLOY_USER \
        --docker-password=$CI_DEPLOY_PASSWORD \
        --docker-email=$GITLAB_USER_EMAIL \
        -n $K8S_NAMESPACE \
        --dry-run=client -o yaml | kubectl apply -f -

deploy:staging:
  <<: *deploy_template
  stage: deploy
  variables:
    K8S_NAMESPACE: "staging"
    REPLICAS: "2"
  script:
    - echo "🚀 Desplegando a STAGING..."
    - |
      kubectl create namespace $K8S_NAMESPACE --dry-run=client -o yaml | kubectl apply -f -
    
    - echo "📝 Aplicando manifiestos de Kubernetes..."
    - |
      envsubst < k8s/deployment.yaml | kubectl apply -f -
      envsubst < k8s/service.yaml | kubectl apply -f -
      envsubst < k8s/ingress.yaml | kubectl apply -f -
    
    - echo "♻️  Reiniciando deployment..."
    - kubectl rollout restart deployment/$APP_NAME -n $K8S_NAMESPACE
    - kubectl rollout status deployment/$APP_NAME -n $K8S_NAMESPACE --timeout=5m
    
    - echo "✓ Despliegue completado"
    - kubectl get pods,svc,ingress -n $K8S_NAMESPACE
  environment:
    name: staging
    url: https://staging.tudominio.com
    on_stop: cleanup:staging
  only:
    - develop
  tags:
    - gitlab-runner-vm1

deploy:production:
  <<: *deploy_template
  stage: deploy
  variables:
    K8S_NAMESPACE: "production"
    REPLICAS: "3"
  script:
    - echo "🚀 Desplegando a PRODUCTION..."
    - |
      kubectl create namespace $K8S_NAMESPACE --dry-run=client -o yaml | kubectl apply -f -
    
    - echo "📝 Aplicando manifiestos de Kubernetes..."
    - |
      envsubst < k8s/deployment.yaml | kubectl apply -f -
      envsubst < k8s/service.yaml | kubectl apply -f -
      envsubst < k8s/ingress.yaml | kubectl apply -f -
    
    - echo "♻️  Reiniciando deployment..."
    - kubectl rollout restart deployment/$APP_NAME -n $K8S_NAMESPACE
    - kubectl rollout status deployment/$APP_NAME -n $K8S_NAMESPACE --timeout=10m
    
    - echo "✓ Despliegue completado"
    - kubectl get pods,svc,ingress -n $K8S_NAMESPACE
  environment:
    name: production
    url: https://api.tudominio.com
    on_stop: cleanup:production
  only:
    - main
  when: manual
  tags:
    - gitlab-runner-vm1

# ==========================================
# STAGE 9: CLEANUP
# ==========================================

cleanup:staging:
  stage: cleanup
  image: google/cloud-sdk:alpine
  variables:
    K8S_NAMESPACE: "staging"
  script:
    - echo "🧹 Limpiando recursos de staging..."
    - echo "$GCP_SERVICE_ACCOUNT_KEY" | base64 -d > ${HOME}/gcp-key.json
    - gcloud auth activate-service-account --key-file ${HOME}/gcp-key.json
    - gcloud config set project $GCP_PROJECT_ID
    - gcloud container clusters get-credentials $GKE_CLUSTER_NAME --zone=$GKE_ZONE
    - kubectl delete all --all -n $K8S_NAMESPACE
  environment:
    name: staging
    action: stop
  when: manual
  only:
    - develop
  tags:
    - gitlab-runner-vm1

cleanup:production:
  stage: cleanup
  image: google/cloud-sdk:alpine
  variables:
    K8S_NAMESPACE: "production"
  script:
    - echo "🧹 Limpiando recursos de production..."
    - echo "$GCP_SERVICE_ACCOUNT_KEY" | base64 -d > ${HOME}/gcp-key.json
    - gcloud auth activate-service-account --key-file ${HOME}/gcp-key.json
    - gcloud config set project $GCP_PROJECT_ID
    - gcloud container clusters get-credentials $GKE_CLUSTER_NAME --zone=$GKE_ZONE
    - kubectl delete all --all -n $K8S_NAMESPACE
  environment:
    name: production
    action: stop
  when: manual
  only:
    - main
  tags:
    - gitlab-runner-vm1

# ==========================================
# JOBS ADICIONALES
# ==========================================

registry:cleanup:
  stage: cleanup
  image: alpine:latest
  script:
    - echo "🧹 Las imágenes antiguas se limpiarán automáticamente según política de GitLab"
    - echo "Configura en: Settings > Packages and registries > Cleanup policies"
  only:
    - schedules
  tags:
    - gitlab-runner-vm1
