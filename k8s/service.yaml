apiVersion: v1
kind: Service
metadata:
  name: ${APP_NAME}
  namespace: ${K8S_NAMESPACE}
  labels:
    app: ${APP_NAME}
    environment: ${K8S_NAMESPACE}
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
    cloud.google.com/backend-config: '{"default": "${APP_NAME}-backend-config"}'
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: ${APP_NAME}
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800

---
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: ${APP_NAME}-backend-config
  namespace: ${K8S_NAMESPACE}
spec:
  healthCheck:
    checkIntervalSec: 10
    timeoutSec: 5
    healthyThreshold: 2
    unhealthyThreshold: 3
    type: HTTP
    requestPath: /actuator/health
    port: 8080
  
  # Configuración de timeout
  timeoutSec: 30
  
  # Configuración de connection draining
  connectionDraining:
    drainingTimeoutSec: 60
  
  # Habilitación de CDN (opcional)
  cdn:
    enabled: false
  
  # IAP (Identity-Aware Proxy) - descomentaría si lo necesitas
  # iap:
  #   enabled: true
  #   oauthclientCredentials:
  #     secretName: oauth-client-secret
