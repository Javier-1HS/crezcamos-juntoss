# =====================================================
# Test Profile Configuration
# =====================================================
# This file contains configuration specific to testing environment

# Use in-memory data during tests
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.username=sa
spring.datasource.password=

# Logging for tests
logging.level.root=INFO
logging.level.com.cloudnative.academy=DEBUG
logging.level.org.springframework=WARN
logging.level.org.springframework.test=DEBUG

# Error details for test debugging
server.error.include-message=always
server.error.include-stacktrace=always

# Disable web server for unit tests
server.port=0
