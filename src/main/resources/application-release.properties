# =====================================================
# Release/Staging Profile Configuration
# =====================================================
# This file contains configuration for pre-production environment
# Use for final validation before production deployment
# Version: 2.0.0

# =====================================================
# Server Configuration
# =====================================================
server.port=8080
server.servlet.context-path=/api
server.shutdown=graceful
server.tomcat.threads.max=150
server.tomcat.threads.min-spare=15

# =====================================================
# Application Identification
# =====================================================
spring.application.name=mi-aplicacion-java
app.version=2.0.0
app.environment=release

# =====================================================
# Logging Configuration (Balanced - more than prod, less than dev)
# =====================================================
# Root level: INFO (less verbose than dev, more than prod)
logging.level.root=INFO

# Application logs: DEBUG for detailed app tracing
logging.level.com.cloudnative.academy=DEBUG

# Framework logs: WARN to reduce noise
logging.level.org.springframework=WARN
logging.level.org.springframework.web=WARN
logging.level.org.springframework.boot=INFO
logging.level.org.springframework.test=WARN

# Data access logs
logging.level.org.springframework.data=WARN

# Pattern with timestamp, logger, and message
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# File output for release environment
logging.file.name=logs/application-release.log
logging.file.max-size=10MB
logging.file.max-history=30
logging.file.total-size-cap=1GB

# =====================================================
# Error Handling (Informative but secure)
# =====================================================
# Show error messages for debugging
server.error.include-message=always
# Show stack traces only with param for security
server.error.include-stacktrace=on_param
# Include exception details for diagnosis
server.error.include-exception=false

# Custom error page path (optional)
server.error.path=/api/error

# =====================================================
# Caching Strategy (Enabled for performance)
# =====================================================
spring.thymeleaf.cache=true
spring.freemarker.cache=true

# =====================================================
# Performance Optimization
# =====================================================
# HTTP compression for bandwidth optimization
server.compression.enabled=true
server.compression.min-response-size=1024
server.compression.excluded-mime-types=image/png,image/jpeg,image/gif,font/woff,font/woff2

# Connection pooling
server.tomcat.max-connections=200
server.tomcat.accept-count=100
server.tomcat.max-http-post-size=2097152

# =====================================================
# Spring Boot Actuator (More endpoints than prod)
# =====================================================
# Expose multiple endpoints for release validation
management.endpoints.web.exposure.include=health,info,metrics,env,loggers,threaddump,heapdump
management.endpoints.web.base-path=/api/actuator

# Health endpoint details for release diagnostics
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true

# Metrics for performance monitoring
management.metrics.enable.jvm=true
management.metrics.enable.process=true
management.metrics.enable.system=true
management.metrics.export.simple.enabled=true

# Info endpoint
management.info.java.enabled=true
management.info.build.enabled=true
management.info.os.enabled=true

# =====================================================
# Jackson (JSON Processing)
# =====================================================
spring.jackson.serialization.indent-output=false
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false

# =====================================================
# Connection Management
# =====================================================
# Graceful shutdown timing
server.shutdown-wait-time=30s

# Connection timeout settings
server.tomcat.connection-timeout=60000
server.connection-timeout=60000

# =====================================================
# Monitoring & Observability
# =====================================================
# Enable request/response logging for release
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestResponseBodyMethodProcessor=DEBUG

# Thread naming for better diagnostics
spring.threads.virtual.enabled=false

# =====================================================
# Database Configuration (if needed)
# =====================================================
# Uncomment and configure when database is added
# spring.datasource.url=jdbc:mysql://release-db:3306/miapp
# spring.datasource.username=${DB_USERNAME}
# spring.datasource.password=${DB_PASSWORD}
# spring.datasource.hikari.maximum-pool-size=20
# spring.datasource.hikari.minimum-idle=5
# 
# spring.jpa.hibernate.ddl-auto=validate
# spring.jpa.properties.hibernate.format_sql=false
# logging.level.org.hibernate.type.descriptor.sql.BasicBinder=INFO

# =====================================================
# Security (if needed)
# =====================================================
# Uncomment when security is added
# spring.security.user.name=admin
# spring.security.user.password=${SECURITY_PASSWORD}

# =====================================================
# Environment-specific Features
# =====================================================
# Enable release-specific features
app.release.enabled=true
# Detailed metrics collection for release validation
app.metrics.collection.enabled=true
# Health check interval
management.endpoints.health.probes.enabled=true

# =====================================================
# Notes
# =====================================================
# Release environment characteristics:
# - Balanced logging for debugging and production readiness
# - Performance optimizations enabled
# - Enhanced monitoring via Actuator
# - Graceful shutdown configured
# - Memory and connection pooling optimized
# - Ready for load testing and validation
