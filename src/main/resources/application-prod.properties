# =====================================================
# Production Profile Configuration
# =====================================================
# This file contains configuration specific to the production environment
# Used when deployed to Railway, Render, or other servers

# Server Configuration - Uses railway PORT variable
server.port=${PORT:8080}
server.servlet.context-path=/
server.shutdown=graceful
server.tomcat.threads.max=100
server.tomcat.threads.min-spare=5

# Logging Configuration - Minimal in production
logging.level.root=WARN
logging.level.com.cloudnative.academy=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.boot=WARN
logging.file.name=/logs/application.log
logging.file.max-size=50MB

# Security - No detailed error messages for security
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false

# Performance and compression
server.compression.enabled=true
server.compression.min-response-size=1024

# Caching enabled for performance
spring.thymeleaf.cache=true
spring.freemarker.cache=true

# JWT Security Configuration
app.jwt.secret=${JWT_SECRET:change-me-in-production}
app.jwt.expiration=86400000

# Actuator - Minimal exposure in production
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized

# Database Connection Pooling - For future use
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# Spring Boot Application Configuration
spring.application.name=crezcamos-juntos-api
app.version=2.0.0
