# =====================================================
# Spring Boot Application Configuration
# =====================================================

# Application Name and Version
spring.application.name=mi-aplicacion-java
app.version=2.0.0

# =====================================================
# Server Configuration
# =====================================================
server.port=9090
server.servlet.context-path=/
server.shutdown=graceful
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=10

# =====================================================
# Logging Configuration
# =====================================================
logging.level.root=INFO
logging.level.com.cloudnative.academy=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n
logging.file.name=logs/application.log
logging.file.max-size=10MB
logging.file.max-history=10

# =====================================================
# JWT Security Configuration
# =====================================================
# IMPORTANTE: Cambiar en producción
app.jwt.secret=${JWT_SECRET:tu-secreto-super-seguro-debe-ser-largo-min-32-caracteres-cambiar-en-prod}
app.jwt.expiration=86400000

# =====================================================
# CORS Configuration
# =====================================================
app.cors.allowed-origins=http://localhost:3000,http://localhost:8080,https://tudominio.com
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
app.cors.max-age=3600

# =====================================================
# Spring Boot Actuator (for monitoring)
# =====================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.endpoints.web.base-path=/api/actuator

# =====================================================
# Jackson (JSON Processing)
# =====================================================
spring.jackson.serialization.indent-output=false
spring.jackson.default-property-inclusion=non_null

# =====================================================
# Environment Detection
# =====================================================
spring.profiles.active=dev

# Development profile properties
spring.profiles.include=dev

# =====================================================
# Security Logging
# =====================================================
logging.level.org.springframework.security=DEBUG

