# =====================================================
# Production Profile Configuration
# =====================================================
# This file contains configuration specific to the production environment

server.port=8080
logging.level.root=WARN
logging.level.com.cloudnative.academy=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.boot=WARN

# No detailed error messages in production (security)
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false

# Performance and security settings
server.compression.enabled=true
server.compression.min-response-size=1024

# Disable caches appropriately
spring.thymeleaf.cache=true
spring.freemarker.cache=true

# Actuator minimal exposure in production
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized
